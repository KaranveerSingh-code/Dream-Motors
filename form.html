<html>
<title>Form </title>
<head>
<style>

body{
background: #64a7c4;
margin: 0;
}

.wrapper{
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%,-50%);
max-width: 350px;
width: 100%;
background: #d1d12a;
padding: 25px;
border-radius: 5px;
box-shadow: 4px 4px 2px rgba(254,236,164,1);
}

.wrapper h2{
text-align: center;
margin-bottom: 20px;
text-transform: uppercase;
letter-spacing: 3px;
Color:black;
}

.wrapper .input_field{
margin-bottom: 10px;
}

.wrapper .input_field input[type="text"],
.wrapper textarea{
border: 1px solid #e0e0e0;
width: 100%;
padding: 10px;
}

.wrapper textarea{
resize: none;
height: 80px;
}

.wrapper .btn input[type="submit"]{
border: 0px;
margin-top: 15px;
padding: 10px;
text-align: center;
width: 100%;
background: #64a7c4;
color: black;
text-transform: uppercase;
letter-spacing: 5px;
font-weight: bold;
border-radius: 25px;
cursor: pointer;
}

#error_message{
margin-bottom: 20px;
background: #64a7c4;
padding: 0px;
text-align: center;
font-size: 14px;
transition: all 0.5s ease;
}

H3{width:300px;height:100px;background-color:skyblue;border:1px solid black;}
Th{background-color:green;color:white;}
.header{padding:50px;background-color:black;position:relative;}
.footer{padding:50px;background-color:orange;}
.content{background-color:pink;opacity:0.8;font-size:30px;border:10px solid pink; padding:20px;text-align:center;}
nav{float:right;}
nav ul{margin:0; padding:0; list-style-type:none;}
nav li{display:inline; margin-left:70px; padding-top:23px; position:relative;}
Nav a {color:red; text-decoration:none; text-transform:uppercase; font-size:14px;}
nav a:hover{color:blue;}
nav a::before{display:block; height:5px; background-color:red; position:absolute; top:0; width:0%; transition:all ease-in-out 250ms;}
nav a:hover::before{width:100%;}
.logo{float:left;margin:0;}

.move{border:3px solid white;height:60px;width:60px;background-image:url('travel.jpeg');background-size:cover;background-position:center;border-radius:50%;position:absolute;top:15px;left:15px;animation:circleanimation 8s infinite;}

@keyframes circleanimation{
0%{top:15px;left:15px;border-radius:50%; background-image:url('travel.jpeg');}
25%{top:40px;left:80px;border-radius:15%; background-image:url('travel.jpeg');}
50%{top:20px;left:50px;border-radius:0% 15%; background-image:url('travel.jpeg');}t
75%{top:35px;left:110px;border-radius:15% 0%; background-image:url('travel.jpeg');}
100%{top:15px;left:15px;border-radius:50%; background-image:url('travel.jpeg');}
}
</style>

<script>

function validate(){
var name = document.getElementById("name").value;
var phone = document.getElementById("phone").value;
var email = document.getElementById("email").value;
var message = document.getElementById("message").value;
var error_message = document.getElementById("error_message");
error_message.style.padding = "10px";
var text;
if(name.length < 5){
text = "Please Enter Full Name";
error_message.innerHTML = text;
return false;
}
if(isNaN(phone) || phone.length != 10){
text = "Please Enter valid Phone Number";
error_message.innerHTML = text;
return false;
}
if(email.indexOf("@") == -1 || email.length < 6){
text = "Please Enter valid Email";
error_message.innerHTML = text;
return false;
}
if(message.length <= 20){
text = "Please Enter More Than 140 Characters";
error_message.innerHTML = text;
return false;
}
alert("Form Submitted Successfully!");
return true;
}
</script>

</head>
<body>
<div class="header">

</h1>
<nav>
<ul>
<li><a href="Index.html">Home</a>
</li>
<li><a href="cars.html">Cars</a>
</li>
<li><a href="bikes.html">Bikes</a>
</li>
<li><a href="customer feedback.html"> Feedback </a>
</li>
<li><a href="FAQ.html">FAQ</a>
</li>
</ul>
</nav>
</div>

<div class="wrapper">
<h2>Enquiry Form</h2>
<div id="error_message">
</div>
<form action="" id="myform" onsubmit="return validate();">
<div class="input_field">
<input type="text" placeholder="Name" id="name">
</div>
<div class="input_field">
<input type="text" placeholder="Phone" id="phone">
</div>
<div class="input_field">
<input type="text" placeholder="Email" id="email">
</div>
<div class="input_field">
<textarea placeholder="Message" id="message"></textarea>
</div>
<div class="btn">
<input type="submit">
</div>
</form>
</div>

</body>
</html>
